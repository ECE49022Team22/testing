# NRST on header pin 40. Must be open-drain: the PCB has a 10k pull-up, a reset button and a MOSFET on NRST.
# This OpenOCD rejects -open-drain on "adapter gpio srst"; open-drain is set by srst_open_drain in reset_config.
adapter gpio srst 21 -chip 0 -active-low
reset_config srst_only srst_nogate srst_open_drain
